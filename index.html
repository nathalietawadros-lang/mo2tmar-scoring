<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تقييم المؤتمر</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 16px; margin: 0; }
    .card { background: #1e293b; max-width: 440px; margin: 20px auto; padding: 24px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    h2 { text-align: center; margin-top: 0; color: #38bdf8; }
    label { font-weight: 600; display: block; margin-top: 16px; margin-bottom: 6px; color: #94a3b8; }
    select, input, button { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 16px; box-sizing: border-box; }
    input:focus, select:focus { outline: none; border-color: #38bdf8; }
    button { background: #0284c7; color: white; font-weight: bold; border: none; margin-top: 24px; cursor: pointer; padding: 14px; border-radius: 8px; }
    button:hover { background: #0369a1; }
    button:disabled { background: #475569; cursor: not-allowed; }
    #status { margin-top: 16px; text-align: center; font-weight: bold; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="card">
    <h2>تسجيل نقاط المؤتمر</h2>
    <form id="scoringForm">
      
      <label>نوع التقييم</label>
      <select id="scoreType" onchange="handleTypeChange()">
        <option value="team">تقييم جماعي (للفريق بالكامل)</option>
        <option value="individual">تقييم فردي (لمخدوم محدد)</option>
      </select>

      <label>الفريق</label>
      <select id="teamSelect" onchange="filterScoutsByTeam()">
        <option value="Team 1">Team 1</option>
        <option value="Team 2">Team 2</option>
        <option value="Team 3">Team 3</option>
        <option value="Team 4">Team 4</option>
      </select>

      <div id="scoutSearchContainer" class="hidden">
        <label>ابحث عن الاسم</label>
        <input list="scoutList" id="scoutInput" placeholder="اكتب أول حروف من الاسم..." />
        <datalist id="scoutList"></datalist>
      </div>

      <label>البند والدرجة المضافة</label>
      <select id="categorySelect"></select>

      <button type="submit" id="submitBtn">إضافة النقاط (تراكمي)</button>
      <div id="status"></div>
    </form>
  </div>

  <script>
    // PASTE YOUR APPS SCRIPT WEB APP URL HERE:

    const ROSTER = [

      { name: "لافينيا نادر راضي", team: "Team 1" }, { name: "فيلوباتير مينا عياد", team: "Team 1" },
      { name: "سيلينا مينا نبيل", team: "Team 1" }, { name: "بافلي اسامة جميل", team: "Team 1" },
      { name: "توني اسامة جميل", team: "Team 1" }, { name: "باميلا مينا فؤاد", team: "Team 1" },
      { name: "كيرلس سامي فكري", team: "Team 1" }, { name: "ادم سامح جرجس", team: "Team 1" },
      { name: "روبين نبيل بشري", team: "Team 1" }, { name: "برنتي مايكل جمال", team: "Team 1" },
      { name: "مارك سامح وديع", team: "Team 1" }, { name: "دولوريس فضل فؤاد", team: "Team 1" },
      { name: "ثيورا هاني", team: "Team 1" }, { name: "كارلوس فادي الفي", team: "Team 1" },
      { name: "ريتا وليد سامي", team: "Team 1" }, { name: "مريم رضا", team: "Team 1" },

      { name: "كيرلس رضا", team: "Team 1" }, { name: "ابانوب جرجس", team: "Team 1" },
      // Team 2
      { name: "كارلوس رامي جرجس", team: "Team 2" }, { name: "سيلينا مينا مقبل", team: "Team 2" },
      { name: "كاراس جوزيف فايز", team: "Team 2" }, { name: "مريم باسم كميل", team: "Team 2" },

      { name: "مارك مينا منير", team: "Team 2" }, { name: "جونيور جون فرج", team: "Team 2" },

      { name: "كيريا مايكل", team: "Team 2" }, { name: "توماس اندرو عاطف", team: "Team 2" },
      { name: "روفانيو مينا الير", team: "Team 2" }, { name: "كاراس اشرف فيكتور", team: "Team 2" },
      { name: "ابرام رامز موريس", team: "Team 2" }, { name: "ميليسيا امجد قابيل", team: "Team 2" },
      { name: "ميرا مينا ابراهيم", team: "Team 2" }, { name: "ميراي عماد", team: "Team 2" },
      { name: "فيلومينا جرجس ناجح", team: "Team 2" }, { name: "يوستينا اشرف اديب", team: "Team 2" },
      { name: "مينا وائل محسن", team: "Team 2" }, { name: "ديفيد ثروت سيحه", team: "Team 2" },
      // Team 3
      { name: "جاكوب رفيق عادل", team: "Team 3" }, { name: "بارثينيا عبد الملك متى", team: "Team 3" },
      { name: "كرمه رامي انور", team: "Team 3" }, { name: "جون عماد عبد الملك", team: "Team 3" },
      { name: "ناتالي الير اميل", team: "Team 3" }, { name: "نيكول الير اميل", team: "Team 3" },
      { name: "مارفل مرقس صدقي", team: "Team 3" }, { name: "مافي اسامة", team: "Team 3" },
      { name: "كلارا اسامة", team: "Team 3" }, { name: "دانيال ماجد ميلاد", team: "Team 3" },
      { name: "جوي رفيق جمال", team: "Team 3" }, { name: "جورج جرجس زكي", team: "Team 3" },
      { name: "يوسف جورج عبد السيد", team: "Team 3" }, { name: "انطونيوس مينا كمال", team: "Team 3" },
      { name: "جوناثان نبيل لبيب", team: "Team 3" }, { name: "برياره بيتر اديب", team: "Team 3" },

      { name: "كريستي كيرلس جرس", team: "Team 3" }, { name: "ايلينا راني نشأت", team: "Team 3" },

      // Team 4
      { name: "مارسلينو مدحت ناجي", team: "Team 4" }, { name: "أنجلينا مارك سامح", team: "Team 4" },
      { name: "مكسيموس اندرو ثروت", team: "Team 4" }, { name: "ارسانيوس عصام عطيه", team: "Team 4" },
      { name: "جرسى جورج فليب", team: "Team 4" }, { name: "كاراس شنودة حاربي", team: "Team 4" },
      { name: "مينا عادل وائل جرجس", team: "Team 4" }, { name: "باتريك اسامة رفعت", team: "Team 4" },
      { name: "ايفين ابراهيم عيسى", team: "Team 4" }, { name: "لارا جون زكريا", team: "Team 4" },
      { name: "كارين ابراهيم صلاح", team: "Team 4" }, { name: "يوسف سامح سامي", team: "Team 4" },
      { name: "مايفن فادي سيف", team: "Team 4" }, { name: "جولينا نشأت ناجي", team: "Team 4" },
      { name: "مريم مدحت سامي", team: "Team 4" }, { name: "ناتالي سامح اسطفانوس", team: "Team 4" },
      { name: "انطونيوس سامي", team: "Team 4" }, { name: "مارينا مايكل صلاح", team: "Team 4" },
      { name: "بولا جابر يوسف", team: "Team 4" }, { name: "كريم عجايبى شحاته", team: "Team 4" },
      { name: "فيلوباتير روماني", team: "Team 4" }
    ];

    const INDIV_CATEGORIES = [
      { name: "درس كتاب و روحي - 200", points: 200 },
      { name: "حضور بدري  - 50", points: 50 },
      { name: "مجموعات العمل - 100", points: 100 },
      { name: "الاكل - 50", points: 50 },
      { name: "صلاة و قداس - 200", points: 200 },
      { name: "الشعار - 50", points: 50 },
      { name: "مزمور - 100", points: 100 },
      { name: "نظافة و النظام - 100", points: 100 }
    ];

    const TEAM_CATEGORIES = [
      { name: "مجموعات العمل (فريق) - 100", points: 100 },
      { name: "مزمور (فريق) - 200", points: 200 },
      { name: "BIG GAME  -  500", points: 500 },
      { name: "لعبة عادية - 200", points: 200 }
    ];

    function handleTypeChange() {
      const type = document.getElementById("scoreType").value;
      const scoutBox = document.getElementById("scoutSearchContainer");
      const catSelect = document.getElementById("categorySelect");
      catSelect.innerHTML = "";

      if (type === "individual") {
        scoutBox.classList.remove("hidden");
        INDIV_CATEGORIES.forEach(c => {
          catSelect.innerHTML += `<option value="${c.name}" data-points="${c.points}">+${c.points} (${c.name})</option>`;
        });
        filterScoutsByTeam();
      } else {
        scoutBox.classList.add("hidden");
        TEAM_CATEGORIES.forEach(c => {
          catSelect.innerHTML += `<option value="${c.name}" data-points="${c.points}">+${c.points} (${c.name})</option>`;
        });
      }
    }

    function filterScoutsByTeam() {
      const team = document.getElementById("teamSelect").value;
      const list = document.getElementById("scoutList");
      list.innerHTML = "";
      ROSTER.filter(s => s.team === team).forEach(s => {
        const opt = document.createElement("option");
        opt.value = s.name;
        list.appendChild(opt);
      });
    }

    // FORM SUBMISSION EVENT LISTENER
    // FAST NON-BLOCKING SUBMISSION
    document.getElementById("scoringForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const status = document.getElementById("status");
      const type = document.getElementById("scoreType").value;
      const catOpt = document.getElementById("categorySelect").selectedOptions[0];
      const target = (type === "individual") 
        ? document.getElementById("scoutInput").value.trim() 
        : document.getElementById("teamSelect").value;

      if (type === "individual" && !target) {
        status.style.color = "#f87171";
        status.innerText = "يرجى تحديد اسم المخدوم أولاً";
        return;
      }

      // 1. Instant UI Feedback (Zero waiting time)
      status.style.color = "#4ade80";
      status.innerText = `✔ تم تسجيل (${catOpt.getAttribute("data-points")} نقطة) لـ ${target}`;
      if (type === "individual") document.getElementById("scoutInput").value = "";

      // 2. Background Dispatch (Fire & Forget with auto-retry)
      const payload = new URLSearchParams({
        type: type,
        target: target,
        category: catOpt.value,
        points: catOpt.getAttribute("data-points")
      });

      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: payload.toString()
      }).catch(() => {
        // Fallback retry using navigator.sendBeacon
        navigator.sendBeacon(SCRIPT_URL, payload);
      });
    });
        status.style.color = "#4ade80";
        status.innerText = "تمت إضافة النقاط بنجاح!";
        if (type === "individual") document.getElementById("scoutInput").value = "";
      } catch (err) {
        status.style.color = "#f87171";
        status.innerText = "حدث خطأ في الإرسال. تحقق من الإنترنت.";
      } finally {
        btn.disabled = false;
      }
    });

    handleTypeChange();
  </script>
</body>
</html>
